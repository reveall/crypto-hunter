name: Crypto Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Crypto Hunter
        run: python crypto_hunter.py

      - name: Save results
        run: |
          git config user.name "Crypto Hunter Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add opportunities.json
          git diff --cached --quiet || git commit -m "Update website checks"
          git push
